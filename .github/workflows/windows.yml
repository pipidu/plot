name: 编译并发布

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-linux

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev

      - name: 读取版本号
        id: version
        run: |
          version=$(awk '/^\[workspace.package\]/{flag=1; next} /^\[/{flag=0} flag && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "windows=sciplot-${version}-b${GITHUB_RUN_NUMBER}-windows-x86_64.exe" >> "$GITHUB_OUTPUT"
          echo "linux=sciplot-${version}-b${GITHUB_RUN_NUMBER}-linux-x86_64" >> "$GITHUB_OUTPUT"

      - name: 编译 Windows
        env:
          SCIPLOT_BUILD: ${{ github.run_number }}
        run: cargo build -p sciplot --release --target x86_64-pc-windows-gnu

      - name: 编译 Linux
        env:
          SCIPLOT_BUILD: ${{ github.run_number }}
        run: cargo build -p sciplot --release

      - name: 打包
        run: |
          windows="${{ steps.version.outputs.windows }}"
          linux="${{ steps.version.outputs.linux }}"
          cp target/x86_64-pc-windows-gnu/release/sciplot.exe "$windows"
          cp target/release/sciplot "$linux"
          chmod +x "$linux"
          sha256sum "$windows" "$linux" | tee SHA256.txt
          {
            echo "自动构建自 ${GITHUB_SHA}。"
            echo
            echo "Windows：下载 \`${windows}\` 后双击运行，不需要安装。面向 64 位 Windows。找不到微软雅黑时，会使用程序内嵌的中文字体。"
            echo
            echo "Linux：下载 \`${linux}\`，加上可执行权限后运行：\`chmod +x ${linux} && ./${linux}\`。面向 64 位 Linux，需要图形环境（X11 或 Wayland）。"
            echo
            echo "提交说明：$(git log -1 --pretty=%s)"
            echo
            echo "SHA256："
            echo
            echo '```'
            cat SHA256.txt
            echo '```'
          } > notes.md

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          windows="${{ steps.version.outputs.windows }}"
          linux="${{ steps.version.outputs.linux }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$windows" "$linux" SHA256.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$windows" "$linux" SHA256.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "SciPlot ${tag#v}" \
              --notes-file notes.md \
              --latest
          fi
