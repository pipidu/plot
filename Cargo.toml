[workspace]
resolver = "2"
members = ["crates/core", "crates/analysis", "crates/plot", "crates/script", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.81"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
